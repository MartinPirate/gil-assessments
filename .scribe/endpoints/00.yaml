name: 'M-Pesa C2B Callbacks'
description: |-

  The two URLs registered with Safaricom Daraja for a paybill / till short code.

  Every documented C2B field is parsed out of the payload and stored in its own
  string column, the untouched body is retained, and the response confirms
  exactly what was captured.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/mpesa/c2b/validation
    metadata:
      custom: []
      groupName: 'M-Pesa C2B Callbacks'
      groupDescription: |-

        The two URLs registered with Safaricom Daraja for a paybill / till short code.

        Every documented C2B field is parsed out of the payload and stored in its own
        string column, the untouched body is retained, and the response confirms
        exactly what was captured.
      subgroup: ''
      subgroupDescription: ''
      title: 'Validation callback'
      description: |-
        Called by Safaricom **before** completing a payment, to ask whether it
        should proceed. The payload is identical to the confirmation body.

        The attempt is recorded, but no money has moved yet, so nothing is
        reconciled against an invoice. Replying `ResultCode: 0` accepts the
        payment; a non-zero code would reject it.

        Note that Validation is only invoked at all if the short code has
        External Validation enabled with Safaricom.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      TransID:
        custom: []
        name: TransID
        description: "Safaricom's receipt number."
        required: true
        example: RKTQDM7W6S
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      TransactionType:
        custom: []
        name: TransactionType
        description: 'The kind of payment.'
        required: false
        example: 'Pay Bill'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      TransTime:
        custom: []
        name: TransTime
        description: 'Timestamp, formatted yyyyMMddHHmmss.'
        required: false
        example: '20260810180000'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      TransAmount:
        custom: []
        name: TransAmount
        description: 'The amount to be paid.'
        required: false
        example: '1500.00'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      BusinessShortCode:
        custom: []
        name: BusinessShortCode
        description: 'The paybill / till being paid.'
        required: false
        example: '600984'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      BillRefNumber:
        custom: []
        name: BillRefNumber
        description: 'The account number the customer typed.'
        required: false
        example: IN-2
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      InvoiceNumber:
        custom: []
        name: InvoiceNumber
        description: "Safaricom's own invoice reference."
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      OrgAccountBalance:
        custom: []
        name: OrgAccountBalance
        description: "The short code's balance."
        required: false
        example: '49197.00'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      ThirdPartyTransID:
        custom: []
        name: ThirdPartyTransID
        description: 'Third-party reference.'
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      MSISDN:
        custom: []
        name: MSISDN
        description: 'The paying phone number.'
        required: false
        example: '254708374149'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      FirstName:
        custom: []
        name: FirstName
        description: "Payer's first name."
        required: false
        example: John
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      MiddleName:
        custom: []
        name: MiddleName
        description: "Payer's middle name."
        required: false
        example: Doe
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      LastName:
        custom: []
        name: LastName
        description: "Payer's last name."
        required: false
        example: Mwangi
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
    cleanBodyParameters:
      TransID: RKTQDM7W6S
      TransactionType: 'Pay Bill'
      TransTime: '20260810180000'
      TransAmount: '1500.00'
      BusinessShortCode: '600984'
      BillRefNumber: IN-2
      OrgAccountBalance: '49197.00'
      MSISDN: '254708374149'
      FirstName: John
      MiddleName: Doe
      LastName: Mwangi
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "ResultCode": 0,
            "ResultDesc": "Accepted",
            "success": true,
            "message": "Transaction captured successfully.",
            "data": {
              "id": 2,
              "callback_type": "validation",
              "received_at": "2026-08-10T18:00:01+00:00",
              "fields": {"TransID": "RKTQDM7W6S", "TransAmount": "1500.00"},
              "payer_name": "John Doe Mwangi",
              "missing_fields": [],
              "unmapped_fields": []
            }
          }
        headers: []
        description: 'Payment accepted'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - POST
    uri: api/mpesa/c2b/confirmation
    metadata:
      custom: []
      groupName: 'M-Pesa C2B Callbacks'
      groupDescription: |-

        The two URLs registered with Safaricom Daraja for a paybill / till short code.

        Every documented C2B field is parsed out of the payload and stored in its own
        string column, the untouched body is retained, and the response confirms
        exactly what was captured.
      subgroup: ''
      subgroupDescription: ''
      title: 'Confirmation callback'
      description: |-
        Called by Safaricom **after** a payment has completed. This is money that
        has actually moved, so the record is captured and then reconciled against
        the invoice named in `BillRefNumber`.

        Returns `ResultCode: 0` once the transaction is safely stored. If storage
        fails the response is non-zero so Safaricom retries — combined with the
        idempotency key that is safer than accepting and silently losing the
        payment.
      authenticated: false
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      TransID:
        custom: []
        name: TransID
        description: "Safaricom's receipt number. Unique — this is the idempotency key."
        required: true
        example: RKTQDM7W6S
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      TransactionType:
        custom: []
        name: TransactionType
        description: 'The kind of payment.'
        required: false
        example: 'Pay Bill'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      TransTime:
        custom: []
        name: TransTime
        description: 'Timestamp of the payment, formatted yyyyMMddHHmmss.'
        required: false
        example: '20260810180000'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      TransAmount:
        custom: []
        name: TransAmount
        description: 'The amount paid. Stored as a string so no precision is lost.'
        required: false
        example: '1500.00'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      BusinessShortCode:
        custom: []
        name: BusinessShortCode
        description: 'The paybill / till that was paid.'
        required: false
        example: '600984'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      BillRefNumber:
        custom: []
        name: BillRefNumber
        description: 'The account number the customer typed. Used to match the receipt to an invoice.'
        required: false
        example: IN-2
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      InvoiceNumber:
        custom: []
        name: InvoiceNumber
        description: "Safaricom's own invoice reference. Usually empty."
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      OrgAccountBalance:
        custom: []
        name: OrgAccountBalance
        description: "The short code's balance after the payment."
        required: false
        example: '49197.00'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      ThirdPartyTransID:
        custom: []
        name: ThirdPartyTransID
        description: 'A reference from a third-party system. Usually empty.'
        required: false
        example: null
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      MSISDN:
        custom: []
        name: MSISDN
        description: 'The paying phone number.'
        required: false
        example: '254708374149'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      FirstName:
        custom: []
        name: FirstName
        description: "Payer's first name."
        required: false
        example: John
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      MiddleName:
        custom: []
        name: MiddleName
        description: "Payer's middle name."
        required: false
        example: Doe
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      LastName:
        custom: []
        name: LastName
        description: "Payer's last name."
        required: false
        example: Mwangi
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
    cleanBodyParameters:
      TransID: RKTQDM7W6S
      TransactionType: 'Pay Bill'
      TransTime: '20260810180000'
      TransAmount: '1500.00'
      BusinessShortCode: '600984'
      BillRefNumber: IN-2
      OrgAccountBalance: '49197.00'
      MSISDN: '254708374149'
      FirstName: John
      MiddleName: Doe
      LastName: Mwangi
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "ResultCode": 0,
            "ResultDesc": "Confirmation received successfully",
            "success": true,
            "message": "Transaction captured successfully.",
            "data": {
              "id": 1,
              "callback_type": "confirmation",
              "received_at": "2026-08-10T18:00:04+00:00",
              "fields": {
                "TransactionType": "Pay Bill",
                "TransID": "RKTQDM7W6S",
                "TransTime": "20260810180000",
                "TransAmount": "1500.00",
                "BusinessShortCode": "600984",
                "BillRefNumber": "IN-2",
                "InvoiceNumber": null,
                "OrgAccountBalance": "49197.00",
                "ThirdPartyTransID": null,
                "MSISDN": "254708374149",
                "FirstName": "John",
                "MiddleName": "Doe",
                "LastName": "Mwangi"
              },
              "payer_name": "John Doe Mwangi",
              "transacted_at": "2026-08-10T18:00:00+00:00",
              "missing_fields": ["InvoiceNumber", "ThirdPartyTransID"],
              "unmapped_fields": []
            }
          }
        headers: []
        description: 'Captured and matched to an invoice'
      -
        custom: []
        status: 403
        content: |-
          {
            "ResultCode": 1,
            "ResultDesc": "Rejected"
          }
        headers: []
        description: 'Caller is not on the Safaricom IP allow-list'
      -
        custom: []
        status: 422
        content: |-
          {
            "ResultCode": 1,
            "ResultDesc": "Rejected: invalid payload",
            "success": false,
            "message": "The callback payload failed validation.",
            "errors": {"TransID": ["The TransID field is required."]}
          }
        headers: []
        description: 'Payload rejected (no TransID)'
      -
        custom: []
        status: 500
        content: |-
          {
            "ResultCode": 1,
            "ResultDesc": "Failed to record transaction. Please retry.",
            "success": false
          }
        headers: []
        description: 'Could not be stored — Safaricom should retry'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
